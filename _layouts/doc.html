---
layout: default
---
<article class="doc">
  <div class="breadcrumb"><a href="{{ '/' | relative_url }}">Home</a> / {{ page.title }}</div>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  <div class="doc-body">{{ content }}</div>
  <div class="doc-footer">
    <a href="{{ site.github_repo }}/edit/main/{{ page.path }}"><i class="fa-solid fa-pen"></i> Edit this page</a>
  </div>
</article>
